# Render Blueprint: public, low-traffic portfolio demonstration.
# Do not add API keys to this file. Configure secrets in the Render dashboard.
services:
  - type: web
    name: bharatpulse-ai
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BHARATPULSE_PUBLIC_MODE
        value: 'true'
      - key: BHARATPULSE_PUBLIC_AI_ENABLED
        value: 'false'
      - key: BHARATPULSE_DATA_DIR
        value: /tmp/bharatpulse
      - key: BHARATPULSE_ALLOWED_HOSTS
        value: '*.onrender.com,localhost,127.0.0.1'
      - key: ENABLE_LLM_FILTER
        value: 'false'
      - key: ENABLE_OLLAMA
        value: 'false'
      - key: LANGSMITH_TRACING
        value: 'false'
